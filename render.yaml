services:
  - type: web
    name: healthpilot-backend
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /admin/
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: healthpilot-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: healthpilot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: healthpilot-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: healthpilot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: healthpilot-db
          property: port
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: healthpilot-frontend
    env: docker
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://healthpilot-backend.onrender.com

  - type: redis
    name: healthpilot-redis
    plan: starter
    ipAllowList: []

databases:
  - name: healthpilot-db
    databaseName: healthpilot
    user: healthpilot
    plan: starter
